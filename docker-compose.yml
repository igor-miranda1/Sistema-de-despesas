services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Configure MYSQL_DATABASE in .env}
      MYSQL_USER: ${DB_APP_USER:?Configure DB_APP_USER in .env}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:?Configure DB_APP_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD in .env}
      DB_APP_USER: ${DB_APP_USER:?Configure DB_APP_USER in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Configure DB_APP_PASSWORD in .env}
      DB_MIGRATOR_USER: ${DB_MIGRATOR_USER:?Configure DB_MIGRATOR_USER in .env}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?Configure DB_MIGRATOR_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./db/02-create-users.sh:/docker-entrypoint-initdb.d/002-create-users.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping --host=127.0.0.1 --user=\"$${MYSQL_USER}\" --password=\"$${MYSQL_PASSWORD}\" --silent",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  mysql-data:
